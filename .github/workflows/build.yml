name: Build and Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check shared/ producer/ mirror/ tests/

      - name: Prune uv cache for CI
        run: uv cache prune --ci

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Prune uv cache for CI
        run: uv cache prune --ci

  image-build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish mirror image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}/nano-p2p-mirror
          PUSH_IMAGE: ${{ github.event_name != 'pull_request' }}
          NANO_MIRROR_PLATFORM: ${{ matrix.platform }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/nano-mirror-build.sh --platform "$NANO_MIRROR_PLATFORM" --build-id "$GITHUB_SHA"

  image-publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: image-build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-platform image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}/nano-p2p-mirror
          BUILD_ID: ${{ github.sha }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/nano-mirror-publish.sh --platforms linux/amd64,linux/arm64
